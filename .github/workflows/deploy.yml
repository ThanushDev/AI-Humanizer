name: Deploy Pages with Groq API Secret

on:
  push:
    branches:
      - main  # ඔයාගේ branch එක master නම් මෙතන master කියල වෙනස් කරන්න
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Groq Secret Key
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_KEY" ]; then
            echo "::error::GROQ_API_KEY secret is missing in Repository Secrets!"
            exit 1
          fi
          python3 -c "
          import os
          key = os.environ.get('GROQ_KEY', '')
          with open('index.html', 'r') as f:
              content = f.read()
          new_content = content.replace('GROQ_API_KEY_PLACEHOLDER', key)
          with open('index.html', 'w') as f:
              f.write(new_content)
          "

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
